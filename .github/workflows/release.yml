name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with the zip, dmg, checksums and the signed
# update feed (appcast.xml) that installed copies read.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count

      - name: Check tag matches the app version
        run: |
          VERSION=$(sed -n 's/.*static let string = "\(.*\)".*/\1/p' Sources/MonitorCore/Version.swift)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AppVersion.string ($VERSION)"
            exit 1
          fi

      - name: Unit tests
        run: ./scripts/test.sh

      - name: Signing identity
        # Every release must carry the same signature, or users lose the Accessibility permission.
        env:
          SIGNING_IDENTITY_P12: ${{ secrets.SIGNING_IDENTITY_P12 }}
          SIGNING_IDENTITY_PASSWORD: ${{ secrets.SIGNING_IDENTITY_PASSWORD }}
        run: ./scripts/import-signing-identity.sh --required

      - name: Update key
        # Installed copies accept only updates signed with the key whose public half the app carries.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          source scripts/config.sh
          if [ -z "$SPARKLE_PUBLIC_KEY" ] || [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::No update key. Run ./scripts/create-update-key.sh once on your Mac and commit scripts/config.sh."
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | swift scripts/check-update-key.swift "$SPARKLE_PUBLIC_KEY"

      - name: Build and package
        run: ./scripts/package.sh

      - name: Sign the update and write the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          source scripts/config.sh
          ZIP="dist/$APP_NAME-$VERSION.zip"
          SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$(./scripts/sparkle-tools.sh)/sign_update" --ed-key-file - "$ZIP")
          ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          ./scripts/make-appcast.sh \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APP_NAME-$VERSION.zip" \
            "$SIGNATURE" "$RUNNER_TEMP/notes.md" > dist/appcast.xml
          cat dist/appcast.xml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of CHANGELOG.md (without the heading).
          ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.dmg dist/SHA256SUMS.txt dist/appcast.xml \
            --title "Candela ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
