name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Unit tests
        run: ./scripts/test.sh

      - name: Signing identity
        # Secrets are not passed to pull requests from forks; those builds are signed ad-hoc.
        env:
          SIGNING_IDENTITY_P12: ${{ secrets.SIGNING_IDENTITY_P12 }}
          SIGNING_IDENTITY_PASSWORD: ${{ secrets.SIGNING_IDENTITY_PASSWORD }}
        run: ./scripts/import-signing-identity.sh

      - name: Build, sign and package
        run: ./scripts/package.sh

      - name: Smoke test the CLI
        run: |
          dist/candelactl --version
          dist/candelactl --help > /dev/null
          # CI machines have no external display; `list` must still succeed.
          dist/candelactl list

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Candela-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 14
